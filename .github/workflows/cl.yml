#instructions for github runner
#branches=github ki repo.
name: ML pipeline
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  train-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Download Project code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install libraries
        run: pip install -r requirements.txt
      - name: ML Model Training
        run: python train.py
      - name: ML Model test
        run: python test.py